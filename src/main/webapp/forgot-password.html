<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GYMORA | Forgot Password</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}


body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    background: #1d1d1d;
}


body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
    linear-gradient(
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.55)
    ),
    url("images/gym-login.jpg");

    background-size: cover;
    background-position: center;

    filter: blur(8px);
    transform: scale(1.05);

    z-index: -1;
}


.container {
    width: 1350px;
    max-width: 100%;
    min-height: 760px;

    display: flex;

    background: white;

    border-radius: 30px;

    overflow: hidden;

    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}


.left {
    width: 58%;

    background:
    linear-gradient(
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.7)
    ),
    url("images/gym-login.jpg");

    background-size: cover;
    background-position: center;

    position: relative;
}


.logo {
    position: absolute;

    top: 35px;
    left: 40px;

    font-size: 38px;
    font-weight: 800;

    color: white;
}


.logo span {
    color: #ff603d;
}


.home {
    position: absolute;

    right: 40px;
    top: 35px;

    color: white;

    text-decoration: none;

    padding: 10px 20px;

    background: rgba(255,255,255,0.2);

    border-radius: 12px;
}


.content {
    position: absolute;

    bottom: 45px;
    left: 40px;

    color: white;
}


.content h2 {
    font-size: 36px;
    margin-bottom: 15px;
}


.content p {
    width: 500px;
    line-height: 1.7;
}


.right {
    width: 42%;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 60px;
}


.box {
    width: 100%;
    max-width: 430px;
}


.brand {
    font-size: 12px;

    letter-spacing: 3px;

    color: #bbb;

    font-weight: bold;

    margin-bottom: 15px;
}


h1 {
    font-size: 38px;

    color: #20242a;

    margin-bottom: 15px;
}


h1 span {
    color: #ff603d;
}


.description {
    color: #888;

    line-height: 1.7;

    margin-bottom: 30px;
}


.input-box {
    margin-bottom: 25px;
}


label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: bold;
}


input {
    width: 100%;

    height: 58px;

    border-radius: 14px;

    border: 1px solid #ddd;

    padding-left: 20px;

    font-size: 14px;
}


button {
    width: 100%;

    height: 58px;

    border: none;

    border-radius: 14px;

    background:
    linear-gradient(
        135deg,
        #ff6b42,
        #ff3d68
    );

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


/* Error Message */

#errorMessage {
    display: none;

    margin-bottom: 20px;

    padding: 12px 15px;

    background: #ffe5e5;

    color: #d60000;

    border: 1px solid #ffb3b3;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 600;

    text-align: center;
}

</style>

</head>


<body>


<div class="container">


    <div class="left">


        <div class="logo">
            GYM<span>ORA</span>
        </div>


        <a href="login.html" class="home">
            🏠 Home
        </a>


        <div class="content">

            <h2>
                Get Back On Track
            </h2>

            <p>
                Forgot your GYMORA password?
                Reset your password securely and continue your fitness journey.
            </p>

        </div>


    </div>


    <div class="right">


        <div class="box">


            <div class="brand">
                GYMORA FITNESS CLUB
            </div>


            <h1>
                Forgot <span>Password?</span>
            </h1>


            <p class="description">
                No worries. Enter your registered email or username.
                We will generate a new password for your account.
            </p>


            <form action="ForgotPasswordServlet" method="post">


                <!-- Error Message -->

                <div id="errorMessage">
                </div>


                <div class="input-box">


                    <label>
                        Email or Username
                    </label>


                    <input
                        type="text"
                        name="identifier"
                        placeholder="Enter email or username"
                        required>


                </div>


                <button type="submit">
                    GENERATE NEW PASSWORD
                </button>


            </form>


        </div>


    </div>


</div>


<script>

    const params =
        new URLSearchParams(window.location.search);


    if (params.get("error") === "notfound") {

        const errorMessage =
            document.getElementById("errorMessage");


        errorMessage.textContent =
            "This email or username is not registered.";


        errorMessage.style.display =
            "block";
    }

</script>


</body>

</html>
